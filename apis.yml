aid: proudly
name: Proudly
description: 'Proudly is a direct-to-consumer baby care brand, co-founded by Dwyane Wade and Gabrielle
  Union, that centers the unique skin and hair needs of Black and Brown babies to make products better
  for all. Its Shopify-hosted storefront sells skincare (balms, washes, oils), hair care, baby wipes,
  absorbent diapers, bath and body kits, apparel and gift bundles under a "No Sketchy Stuff" ingredient-transparency
  commitment. Backed by Initialized Capital (via A-Frame Brands), Atacama Ventures and VMG Partners.
  Proudly is a consumer commerce company with no public developer API or SDK program; the only machine
  surface is its Shopify Customer Account OpenID/OAuth well-known configuration.'
